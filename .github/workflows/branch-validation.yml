name: Branch Name Validation

on:
  pull_request:
    branches:
      - main
      - develop

jobs:
  check-branch-name:
    runs-on: ubuntu-latest

    steps:
      - name: Check branch name
        run: |
          BRANCH_NAME="${{ github.event.pull_request.head.ref }}"

          if [[ "$BRANCH_NAME" == "develop" || "$BRANCH_NAME" == "main" ]]; then
            echo "Base branch is allowed: $BRANCH_NAME"
            exit 0
          fi

          if [[ "$BRANCH_NAME" =~ ^(feature|fix|docs|chore|refactor)/.+$ ]]; then
            echo "Correct branch name"
          else
            echo "Wrong branch name: $BRANCH_NAME"
            exit 1
          fi
